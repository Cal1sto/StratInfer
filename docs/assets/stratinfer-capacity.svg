<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">StratInfer long-running agent capacity</title>
  <desc id="desc">Memory hierarchy and operational capabilities for eight specialist agents using RTX 5090, RTX 4080, host memory and SSD.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07131c"/>
      <stop offset="1" stop-color="#163146"/>
    </linearGradient>
    <linearGradient id="tier1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="tier2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="tier3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Capacity for long-running specialist agents</text>
  <text x="60" y="94" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="17">Bounded hot memory, durable project memory and supervised execution</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="60" y="144" fill="#f8fafc" font-size="20" font-weight="600">Three-tier context memory</text>
    <rect x="60" y="170" width="500" height="82" rx="16" fill="url(#tier1)" opacity=".95"/>
    <text x="88" y="207" fill="#042f3e" font-size="24" font-weight="700">4 GiB · RTX 4080 exact K/V</text>
    <text x="88" y="232" fill="#083344" font-size="15">Fast helper cache · voice-balanced live profile</text>

    <rect x="60" y="270" width="500" height="82" rx="16" fill="url(#tier2)" opacity=".95"/>
    <text x="88" y="307" fill="#052e2b" font-size="24" font-weight="700">12 GiB · bounded host cache</text>
    <text x="88" y="332" fill="#064e3b" font-size="15">Capacity plan: five 128K-class target snapshots</text>

    <rect x="60" y="370" width="500" height="82" rx="16" fill="url(#tier3)" opacity=".95"/>
    <text x="88" y="407" fill="#2e1065" font-size="24" font-weight="700">64 GiB · SSD per project</text>
    <text x="88" y="432" fill="#3b0764" font-size="15">Durable sessions · 32 GiB filesystem safety floor</text>

    <path d="M310 252 V270 M310 352 V370" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 6"/>

    <text x="630" y="144" fill="#f8fafc" font-size="20" font-weight="600">Agent operating envelope</text>
    <g fill="#102b40" stroke="#24536c">
      <rect x="630" y="170" width="235" height="84" rx="14"/>
      <rect x="885" y="170" width="235" height="84" rx="14"/>
      <rect x="630" y="274" width="235" height="84" rx="14"/>
      <rect x="885" y="274" width="235" height="84" rx="14"/>
      <rect x="630" y="378" width="235" height="84" rx="14"/>
      <rect x="885" y="378" width="235" height="84" rx="14"/>
    </g>
    <text x="654" y="205" fill="#5eead4" font-size="25" font-weight="700">8 specialists</text>
    <text x="654" y="232" fill="#cbd5e1" font-size="14">isolated roles + handoffs</text>
    <text x="909" y="205" fill="#5eead4" font-size="25" font-weight="700">128K target</text>
    <text x="909" y="232" fill="#cbd5e1" font-size="14">working context per role</text>
    <text x="654" y="309" fill="#5eead4" font-size="25" font-weight="700">524K max</text>
    <text x="654" y="336" fill="#cbd5e1" font-size="14">single-engine context limit</text>
    <text x="909" y="309" fill="#5eead4" font-size="25" font-weight="700">10 MCP tools</text>
    <text x="909" y="336" fill="#cbd5e1" font-size="14">FastMCP + NOEMA control</text>
    <text x="654" y="413" fill="#5eead4" font-size="25" font-weight="700">19 / 19</text>
    <text x="654" y="440" fill="#cbd5e1" font-size="14">strict deterministic hashes</text>
    <text x="909" y="413" fill="#5eead4" font-size="25" font-weight="700">60 / 60</text>
    <text x="909" y="440" fill="#cbd5e1" font-size="14">paired quality checks</text>
  </g>

  <rect x="60" y="490" width="1060" height="70" rx="16" fill="#0c2030" stroke="#24536c"/>
  <text x="86" y="520" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Operational boundary</text>
  <text x="86" y="544" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">Eight 128K targets are capacity-planned; this does not claim eight simultaneous 524K contexts. A 24-hour endurance gate remains open.</text>
  <text x="60" y="594" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">RTX 5090 inference · RTX 4080 voice + exact K/V · bounded host/SSD tiers · reversible MOAI cutover</text>
</svg>
